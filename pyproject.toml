[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tender"
version = "0.2.0"
description = "Independent, evidence-backed verification for AI-generated code changes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
tender = "tender.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tender"]

# Ship the zero-build dashboard inside the package so installed wheels and
# Docker images serve /dashboard without a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"dashboard" = "tender/web/dashboard"
"assets/favicon.svg" = "tender/web/assets/favicon.svg"

[tool.hatch.build.targets.sdist]
include = ["src/tender", "dashboard", "assets/favicon.svg", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
