name: Deploy portfolio demo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - dashboard/app.js
      - dashboard/styles.css
      - .github/workflows/deploy-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R demo/. _site/
          # The replay page reuses the live dashboard bundle (single source of truth).
          mkdir -p _site/dashboard
          cp dashboard/app.js dashboard/styles.css _site/dashboard/
          mkdir -p _site/docs/experiments
          cp docs/experiments/groq-retry-ablation-3tasks-v1.json _site/docs/experiments/
          cp docs/PROVIDER_TRIALS.md _site/docs/PROVIDER_TRIALS.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
