name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historical-record integrity tests compare against the audited commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Prepare deterministic benchmark fixture commits
        run: python scripts/prepare_fixtures.py
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run offline test suite
        run: pytest -q
      - name: Check the public replay rebuilds from committed inputs
        run: python scripts/record_replay.py --check
      - name: Check the landing-page figures match committed records
        run: python scripts/build_site_data.py --check
      - name: Validate pinned benchmark dataset
        run: python -m tender validate-benchmark --manifest experiments/retry-ablation-v1.toml --dataset benchmarks/tasks.jsonl

      - name: Validate paired retrieval benchmark dataset
        run: python -m tender validate-benchmark --manifest experiments/retrieval-cap-ab-v1.toml --dataset benchmarks/paired-tasks-v1.jsonl
