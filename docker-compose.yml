services:
  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: tender-sandbox:local
    command: ["true"]

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TENDER_ENV: local
      TENDER_DB_PATH: /data/tender.db
      TENDER_WORKSPACE_ROOT: /workspaces
      TENDER_ARTIFACT_ROOT: /data/artifacts
      TENDER_APPROVAL_TOKEN: ${TENDER_APPROVAL_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./.tender-data:/data
      - ./benchmarks/fixtures:/workspaces:ro
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      TENDER_DB_PATH: /data/tender.db
      TENDER_WORKSPACE_ROOT: /workspaces
      TENDER_ARTIFACT_ROOT: /data/artifacts
      TENDER_SANDBOX_IMAGE: tender-sandbox:local
      TENDER_WORKER_POLL_SECONDS: "1"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      TMPDIR: ${PWD}/.tender-tmp
    volumes:
      - ./.tender-data:/data
      - ${PWD}/.tender-tmp:${PWD}/.tender-tmp
      - ./benchmarks/fixtures:/workspaces:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
