<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title"><title id="title">Tender — coding agents, measured</title><rect width="1280" height="640" fill="#fff"/><path d="M88 94h1104v452H88z" fill="none" stroke="#111" stroke-width="2"/><text x="142" y="250" fill="#080808" font-family="Helvetica Neue,Arial,sans-serif" font-size="104" font-weight="600" letter-spacing="-8">tender.</text><text x="148" y="326" fill="#333" font-family="Helvetica Neue,Arial,sans-serif" font-size="30">Give coding agents a task. Keep the proof.</text><path d="M148 382h984" stroke="#111" stroke-width="2"/><text x="148" y="448" fill="#555" font-family="SFMono-Regular,Consolas,monospace" font-size="20">PIN TASK   /   ISOLATE RUN   /   VERIFY PATCH   /   RECORD EVIDENCE</text><circle cx="1130" cy="210" r="9" fill="#111"/></svg>
