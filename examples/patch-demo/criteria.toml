# Acceptance criteria for the demo, written before any candidate patch exists.
schema_version = 1

[task]
title = "median() is wrong for even-length input"
description = "median([4, 1, 3, 2]) returns 3. For an even number of values it must return the mean of the two middle values (2.5). Keep the existing behaviour for odd-length and empty input."

[[target]]
name = "even-length median (hidden evaluator tests)"
pytest = [
  "tests/test_median_target.py::test_median_even_length_averages_middle_values",
  "tests/test_median_target.py::test_median_even_length_floats",
]

[[regression]]
name = "existing statistics behaviour"
pytest = ["tests/test_core.py"]

[integrity]
hidden_tests = "hidden"

[constraints]
timeout_seconds = 60
deadline_seconds = 300
